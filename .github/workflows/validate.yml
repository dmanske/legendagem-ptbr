name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python scripts
        run: python -m unittest discover -s tests -v

      - name: Test macOS/Linux installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh
          CODEX_HOME="$RUNNER_TEMP/codex" bash install.sh
          test -f "$RUNNER_TEMP/codex/skills/tradutor-de-clipes/SKILL.md"

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex"
          ./install.ps1
          if (-not (Test-Path "$env:CODEX_HOME\skills\tradutor-de-clipes\SKILL.md")) { exit 1 }
