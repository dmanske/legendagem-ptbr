name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test Python scripts
        run: python -m unittest discover -s tests -v

      - name: Test macOS/Linux installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh
          mkdir -p "$RUNNER_TEMP/codex/skills/tradutor-de-clipes"
          mkdir -p "$RUNNER_TEMP/codex/skills/legendagem-ptbr"
          touch "$RUNNER_TEMP/codex/skills/tradutor-de-clipes/legacy-marker"
          touch "$RUNNER_TEMP/codex/skills/legendagem-ptbr/current-marker"
          CODEX_HOME="$RUNNER_TEMP/codex" bash install.sh
          test -f "$RUNNER_TEMP/codex/skills/legendagem-ptbr/SKILL.md"
          test ! -d "$RUNNER_TEMP/codex/skills/tradutor-de-clipes"
          test -z "$(find "$RUNNER_TEMP/codex/skills" -maxdepth 1 -type d -name '*.backup-*' -print -quit)"
          find "$RUNNER_TEMP/codex/skill-backups" -maxdepth 1 -type d -name 'tradutor-de-clipes.backup-*' | grep -q .
          find "$RUNNER_TEMP/codex/skill-backups" -maxdepth 1 -type d -name 'legendagem-ptbr.backup-*' | grep -q .

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex"
          $legacy = Join-Path $env:CODEX_HOME "skills\tradutor-de-clipes"
          $current = Join-Path $env:CODEX_HOME "skills\legendagem-ptbr"
          New-Item -ItemType Directory -Force -Path $legacy | Out-Null
          New-Item -ItemType Directory -Force -Path $current | Out-Null
          New-Item -ItemType File -Path (Join-Path $legacy "legacy-marker") | Out-Null
          New-Item -ItemType File -Path (Join-Path $current "current-marker") | Out-Null
          ./install.ps1
          if (-not (Test-Path "$env:CODEX_HOME\skills\legendagem-ptbr\SKILL.md")) { exit 1 }
          if (Test-Path $legacy) { exit 1 }
          $indexedBackup = Get-ChildItem (Join-Path $env:CODEX_HOME "skills") -Directory -Filter "*.backup-*"
          if ($indexedBackup) { exit 1 }
          $backup = Get-ChildItem (Join-Path $env:CODEX_HOME "skill-backups") -Directory -Filter "tradutor-de-clipes.backup-*"
          if (-not $backup) { exit 1 }
          $currentBackup = Get-ChildItem (Join-Path $env:CODEX_HOME "skill-backups") -Directory -Filter "legendagem-ptbr.backup-*"
          if (-not $currentBackup) { exit 1 }
